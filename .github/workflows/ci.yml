name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build the LUNA Builder SDK
        run: npm run sdk:build
      - name: Install
        run: npm ci
      - name: Build the map bundle
        run: npm run bundle -w controller-maps
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Pack Controller Maps
        run: npm run pack -w controller-maps
      - uses: actions/upload-artifact@v4
        with:
          name: controller-maps.lunaaddon
          path: add-ons/controller-maps/*.lunaaddon
